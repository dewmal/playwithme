[package]
name = "presenta"
version = "0.1.0"
description = "Markdown, Python, and ink presentation studio"
authors = ["Presenta"]
edition = "2024"

[lib]
name = "presenta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
